{% extends "base.html" %}

{% block title %}お気に入り削除確認 - 顔文字辞書{% endblock %}

{% block content %}
    <h1>お気に入り削除確認</h1>

    <p>本当に削除しますか？</p>

    <p>
        <strong>{{ name }}</strong> : {{ kaomozi }}
    </p>

    <!-- 削除実行 -->
    <form action="/favorite/remove/{{ name }}" method="POST">
        <button type="submit" class="btn btn-danger">はい（削除する）</button>
    </form>
    <br><br>

    <!-- 戻る -->
    <a href="/favorite">いいえ（戻る）</a>
{% endblock %}
